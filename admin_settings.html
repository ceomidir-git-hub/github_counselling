<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>환경설정 - 목업</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css"/>
<style>
:root{
  --blue:#0b4ea2;
  --blue2:#1565d8;
  --bg:#f3f7fc;
  --card:#fff;
  --ink:#111827;
  --muted:#64748b;
  --line:#e5e7eb;
  --red:#ef4444;
  --orange:#f97316;
  --green:#22c55e;
  --shadow:0 18px 50px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#eaf3ff,#fbfdff);
  color:var(--ink);
}
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 10px;
}
.phone{
  width:min(430px,100%,44vh);
  aspect-ratio:430/900;
  height:auto;
  background:#111;
  border-radius:42px;
  padding:12px;
  box-shadow:var(--shadow);
}
.screen{
  height:100%;
  border-radius:32px;
  background:var(--bg);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.top{
  background:linear-gradient(135deg,#073b86,#0d63ce);
  color:#fff;
  padding:16px 18px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.top .back{
  width:32px;height:32px;border-radius:9px;
  background:rgba(255,255,255,.14);
  display:grid;place-items:center;font-size:18px;
  cursor:pointer;
}
.top .title{flex:1;font-size:14px;font-weight:800;letter-spacing:-.3px}
.top .badge{
  font-size:11px;font-weight:800;
  background:rgba(255,255,255,.18);
  padding:4px 9px;border-radius:999px;
}

.body{
  flex:1;
  overflow-y:auto;
  padding:14px 14px 90px;
}

.sectionLabel{
  font-size:12px;font-weight:800;color:var(--muted);
  margin:6px 2px 8px;letter-spacing:-.2px;
}

.userCard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  margin-bottom:10px;
  box-shadow:0 6px 16px rgba(15,23,42,.05);
}
.userCard .row1{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:6px;
}
.userCard .name{
  font-size:15px;font-weight:800;letter-spacing:-.3px;
  display:flex;align-items:center;gap:6px;
}
.userCard .roleTag{
  font-size:10px;font-weight:800;
  background:#eef3ff;color:var(--blue);
  padding:3px 7px;border-radius:999px;
}
.userCard .statusTag{
  font-size:11px;font-weight:800;
  padding:4px 9px;border-radius:999px;
}
.statusTag.active{background:#eafff0;color:#15803d}
.statusTag.inactive{background:#fef2f2;color:var(--red)}

.userCard .infoLine{
  font-size:12.5px;color:var(--muted);
  display:flex;gap:14px;margin-bottom:2px;
}
.userCard .infoLine i{font-size:13px}

.userCard .actions{
  display:flex;gap:7px;margin-top:10px;
}
.userCard .actions button{
  flex:1;
  height:34px;
  border-radius:9px;
  border:1px solid var(--line);
  background:#f8fafc;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
}
.userCard .actions .editBtn{color:var(--blue2);border-color:#cfe0fb}
.userCard .actions .deactivateBtn{color:var(--red);border-color:#fbd5d5}
.userCard .actions .activateBtn{color:#15803d;border-color:#bdeecb}

.fab{
  position:absolute;
  right:16px;bottom:16px;
  height:46px;padding:0 18px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;border:0;
  font-weight:800;font-size:13.5px;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 10px 24px rgba(11,78,162,.35);
  cursor:pointer;
}

/* 사용자 추가/수정 모달 */
.modalOverlay{
  position:absolute;inset:0;
  background:rgba(10,15,30,.45);
  display:none;
  align-items:flex-end;
  z-index:20;
}
.modalOverlay.open{display:flex}
.sheet{
  width:100%;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:18px 18px 20px;
  max-height:88%;
  overflow-y:auto;
}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sheet .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{
  display:block;font-size:12.5px;font-weight:700;color:#334155;margin-bottom:6px;
}
.field input{
  width:100%;height:44px;border-radius:11px;
  border:1px solid var(--line);
  padding:0 12px;font-size:13.5px;outline:none;
  background:#f8fafc;
}
.field input:focus{border-color:var(--blue2);background:#fff}
.inviteNotice{
  display:flex;gap:9px;align-items:flex-start;
  background:#eef6ff;border:1px solid #d3e6ff;
  border-radius:12px;padding:11px 12px;
  font-size:11.5px;color:#1d4ed8;line-height:1.5;
  margin-top:2px;
}
.inviteNotice i{font-size:16px;margin-top:1px;flex-shrink:0}

.sheetBtnRow{display:flex;gap:8px;margin-top:16px}
.sheetBtnRow button{
  flex:1;height:46px;border-radius:12px;border:0;
  font-weight:800;font-size:14px;cursor:pointer;
}
.sheetBtnRow .cancel{background:#f1f5f9;color:#475569;flex:0 0 84px}
.sheetBtnRow .confirm{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:12.5px}

.toast{
  position:absolute;left:50%;bottom:90px;
  transform:translateX(-50%) translateY(10px);
  background:#111827;color:#fff;font-size:12.5px;font-weight:700;
  padding:10px 16px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.2s ease;
  white-space:nowrap;z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.note{
  font-size:11.5px;color:#94a3b8;text-align:center;margin-top:14px;line-height:1.5;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="screen">

      <div class="top">
        <div class="back" id="backBtn">←</div>
        <div class="title">환경설정 · 사용자 관리</div>
        <div class="badge">관리자</div>
      </div>

      <div class="body">
        <div class="sectionLabel">등록된 사용자 (0)</div>

        <div class="emptyState" id="emptyState">
          <div style="font-size:30px;margin-bottom:8px;">📭</div>
          <p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.6;">
            아직 등록된 사용자가 없습니다.<br>
            아래 "＋ 사용자 등록" 버튼으로 첫 사용자를 등록해 주세요.
          </p>
        </div>

        <p class="note">비활성화된 계정은 로그인이 차단되며,<br>언제든 재활성화할 수 있습니다.</p>
      </div>

      <button class="fab" id="openAddBtn">＋ 사용자 등록</button>

      <!-- 사용자 등록 바텀시트 -->
      <div class="modalOverlay" id="addOverlay">
        <div class="sheet">
          <h3>새 사용자 등록</h3>
          <div class="sub">등록하면 입력하신 이메일로 초대 메일이 발송됩니다.<br>비밀번호는 본인이 메일에서 직접 설정합니다.</div>

          <div class="field">
            <label>이름</label>
            <input type="text" placeholder="예: 홍길동" />
          </div>
          <div class="field">
            <label>전화번호</label>
            <input type="tel" placeholder="010-0000-0000" />
          </div>
          <div class="field">
            <label>이메일 (초대 메일이 발송됩니다)</label>
            <input type="email" placeholder="example@company.com" />
          </div>

          <div class="inviteNotice">
            <i class="ti ti-mail-forward"></i>
            <span>"등록" 클릭 시 즉시 초대 메일이 발송되며,<br>사용자가 메일 속 링크에서 비밀번호를 설정하면 바로 로그인 가능해집니다.</span>
          </div>

          <div class="sheetBtnRow">
            <button class="cancel" id="cancelAddBtn">취소</button>
            <button class="confirm" id="confirmAddBtn">＋ 등록하고 초대 메일 보내기</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast"></div>

    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById('addOverlay');
  const toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window._t);
    window._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('openAddBtn').addEventListener('click', () => overlay.classList.add('open'));
  document.getElementById('cancelAddBtn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('open'); });

  // 목업용 시뮬레이션: 실제 메일 발송/DB 저장은 하지 않음 (Edge Function 연동 전 디자인 확인용)
  document.getElementById('confirmAddBtn').addEventListener('click', () => {
    overlay.classList.remove('open');
    showToast('✔ 초대 메일을 발송했습니다 (목업)');
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== 로그인 가드 =====
  // index.html과 동일한 프로젝트/세션 저장 방식(sessionStorage)을 사용하므로,
  // index.html에서 로그인한 세션이 그대로 이 페이지에서도 인식됩니다.
  // ※ 지금은 "로그인 여부"만 확인합니다. 추후 staff_profiles.role === 'admin' 체크로 교체 예정.
  const SUPABASE_URL = "https://fafdxaifluftnertbpvr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db";
  let sb = null;
  try {
    if (!window.supabase) throw new Error("Supabase 라이브러리를 불러오지 못했습니다.");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
    });
  } catch (err) {
    console.error("Supabase 초기화 실패:", err);
  }

  (async function guardSettingsPage(){
    if (!sb) { window.location.href = 'index.html'; return; }
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      // 로그인 안 된 상태로 직접 접근 시 메인으로 돌려보냄
      window.location.href = 'index.html';
    }
  })();
</script>
</body>
</html>
