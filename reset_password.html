<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>비밀번호 재설정 - 상담도우미</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css"/>
<style>
:root{
  --blue:#0b4ea2;
  --blue2:#1565d8;
  --bg:#f3f7fc;
  --card:#fff;
  --ink:#111827;
  --muted:#64748b;
  --line:#e5e7eb;
  --red:#ef4444;
  --green:#22c55e;
  --shadow:0 18px 50px rgba(15,23,42,.18)
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#eaf3ff,#fbfdff);
  color:var(--ink)
}

button,input{font:inherit}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 10px
}

.phone{
  width:min(430px,100%,44vh);
  aspect-ratio:430/900;
  height:auto;
  background:#111;
  border-radius:42px;
  padding:12px;
  box-shadow:var(--shadow)
}

.screen{
  height:100%;
  border-radius:32px;
  background:var(--bg);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column
}

.top{
  height:92px;
  flex:0 0 auto;
  background:linear-gradient(135deg,#073b86,#0d63ce);
  color:#fff;
  padding:12px 18px 10px;
  position:relative
}

.pill{
  position:absolute;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  width:116px;
  height:27px;
  background:#06152c;
  border-radius:999px
}

.status{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:800;
  margin-bottom:9px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px
}

.shield{
  width:42px;
  height:42px;
  border-radius:15px;
  background:linear-gradient(145deg,#dff6ff,#60a5fa);
  display:grid;
  place-items:center;
  font-size:22px;
  flex:0 0 auto
}

.brand h1{
  margin:0;
  font-size:17px
}

.brand p{
  margin:2px 0 0;
  font-size:11px;
  opacity:.85
}

.content{
  flex:1;
  overflow:auto;
  padding:22px 20px;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.icon-badge{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#eef6ff;
  border:1px solid #bfdbfe;
  display:grid;
  place-items:center;
  font-size:26px;
  color:var(--blue2);
  margin:0 auto 14px
}

.icon-badge.success{
  background:#f0fdf4;
  border-color:#bbf7d0;
  color:var(--green)
}

.icon-badge.error{
  background:#fef2f2;
  border-color:#fecaca;
  color:var(--red)
}

h2.title{
  margin:0 0 6px;
  font-size:18px;
  text-align:center;
  color:var(--ink)
}

p.sub{
  margin:0 0 22px;
  font-size:12.5px;
  color:var(--muted);
  text-align:center;
  line-height:1.5
}

.row{
  margin-bottom:12px
}

.row label{
  display:block;
  font-size:11px;
  color:#334155;
  font-weight:900;
  margin-bottom:5px
}

.row input{
  border:1px solid #dbe4f0;
  border-radius:12px;
  padding:12px;
  width:100%;
  font-size:14px
}

.row input:focus{
  outline:2px solid var(--blue2);
  outline-offset:1px
}

.hint{
  font-size:10.5px;
  color:var(--muted);
  margin-top:5px
}

.errorMsg{
  display:none;
  background:#fef2f2;
  border:1px solid #fecaca;
  color:#b91c1c;
  font-size:11.5px;
  font-weight:800;
  border-radius:10px;
  padding:9px 10px;
  margin-bottom:12px;
  line-height:1.5
}

.errorMsg.show{display:block}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  background:var(--blue2);
  color:#fff;
  font-weight:950;
  padding:13px;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
  display:block;
  font-size:14px
}

.btn:disabled{
  opacity:.55;
  cursor:default
}

.btn.gray{
  background:#f1f5f9;
  color:#0f172a;
  border:1px solid #dbe4f0;
  margin-top:8px
}

.loadingWrap{
  text-align:center;
  color:var(--muted);
  font-size:13px
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid #dbe4f0;
  border-top-color:var(--blue2);
  border-radius:50%;
  margin:0 auto 14px;
  animation:spin .8s linear infinite
}

@keyframes spin{to{transform:rotate(360deg)}}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
<main class="phone">
<div class="screen">
<header class="top">
<div class="pill"></div>
<div class="status">
<span>9:41</span>
<span>●●● 5G 🔋</span>
</div>
<div class="brand">
<div class="shield"><i class="ti ti-lock" aria-hidden="true"></i></div>
<div>
<h1>상담도우미</h1>
<p>비밀번호 재설정</p>
</div>
</div>
</header>

<section class="content">

<!-- 1) 로딩 (링크 확인 중) -->
<div id="stateLoading" class="loadingWrap">
<div class="spinner"></div>
<div>인증 링크를 확인하는 중입니다...</div>
</div>

<!-- 2) 새 비밀번호 입력 폼 -->
<div id="stateForm" class="hidden">
<div class="icon-badge"><i class="ti ti-key" aria-hidden="true"></i></div>
<h2 class="title">새 비밀번호 설정</h2>
<p class="sub">로그인에 사용할 새 비밀번호를 입력해주세요.</p>

<div class="errorMsg" id="formError"></div>

<div class="row">
<label for="pw1">새 비밀번호</label>
<input id="pw1" type="password" placeholder="6자 이상 입력" autocomplete="new-password" />
<div class="hint">최소 6자 이상 입력해주세요.</div>
</div>
<div class="row">
<label for="pw2">새 비밀번호 확인</label>
<input id="pw2" type="password" placeholder="다시 한 번 입력" autocomplete="new-password" />
</div>

<button class="btn" id="submitBtn" type="button" onclick="submitNewPassword()">비밀번호 변경</button>
</div>

<!-- 3) 성공 화면 -->
<div id="stateSuccess" class="hidden">
<div class="icon-badge success"><i class="ti ti-check" aria-hidden="true"></i></div>
<h2 class="title">비밀번호가 변경되었습니다</h2>
<p class="sub">새 비밀번호로 다시 로그인해주세요.</p>
<a class="btn" id="goLoginBtn" href="./index.html">로그인 화면으로 이동</a>
</div>

<!-- 4) 오류/만료 화면 -->
<div id="stateError" class="hidden">
<div class="icon-badge error"><i class="ti ti-alert-triangle" aria-hidden="true"></i></div>
<h2 class="title">링크가 유효하지 않습니다</h2>
<p class="sub" id="errorDetail">인증 링크가 만료되었거나 이미 사용되었습니다.<br/>다시 시도해주세요.</p>
<a class="btn gray" id="backBtn" href="./index.html">로그인 화면으로 돌아가기</a>
</div>

</section>
</div>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== Supabase 연결 설정 (index.html과 동일) =====
  const SUPABASE_URL = "https://fafdxaifluftnertbpvr.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db";
  let sb = null;
  try {
    if (!window.supabase) throw new Error("Supabase 라이브러리를 불러오지 못했습니다.");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        storage: window.sessionStorage, // index.html과 동일한 세션 저장 방식
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
  } catch (err) {
    console.error("Supabase 초기화 실패:", err);
  }

  const stateLoading = document.getElementById('stateLoading');
  const stateForm = document.getElementById('stateForm');
  const stateSuccess = document.getElementById('stateSuccess');
  const stateError = document.getElementById('stateError');

  function showState(el){
    [stateLoading, stateForm, stateSuccess, stateError].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  function showFormError(msg){
    const el = document.getElementById('formError');
    el.textContent = msg;
    el.classList.add('show');
  }

  function clearFormError(){
    const el = document.getElementById('formError');
    el.classList.remove('show');
    el.textContent = '';
  }

  let recoveryReady = false;
  let settled = false; // 최종 상태(폼/오류) 확정 여부

  function settleToForm(){
    if (settled) return;
    settled = true;
    recoveryReady = true;
    showState(stateForm);
  }

  function settleToError(msg){
    if (settled) return;
    settled = true;
    if (msg) document.getElementById('errorDetail').innerHTML = msg;
    showState(stateError);
  }

  if (!sb) {
    settleToError("서버 연결에 실패했습니다.<br/>잠시 후 다시 시도해주세요.");
  } else {
    // 이메일 링크를 통해 들어오면 Supabase가 URL을 파싱하며
    // PASSWORD_RECOVERY 이벤트를 발생시키고 임시 세션을 심어줍니다.
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        settleToForm();
      }
    });

    // 이벤트가 이미 지나갔을 수 있으므로, 세션 존재 여부도 함께 확인합니다.
    (async () => {
      try {
        const { data, error } = await sb.auth.getSession();
        if (error) throw error;

        const hash = window.location.hash || '';
        const looksLikeRecoveryLink = hash.includes('type=recovery') || window.location.search.includes('type=recovery');

        if (data && data.session) {
          settleToForm();
        } else if (!looksLikeRecoveryLink) {
          // 링크 없이 직접 들어온 경우
          settleToError("올바르지 않은 접근입니다.<br/>이메일로 받은 재설정 링크를 통해 접속해주세요.");
        }
        // looksLikeRecoveryLink가 true인데 세션이 아직 없다면,
        // onAuthStateChange의 PASSWORD_RECOVERY 이벤트를 잠시 더 기다립니다.
      } catch (err) {
        console.error('세션 확인 실패:', err);
      }
    })();

    // 일정 시간 안에 recovery 세션이 확인되지 않으면 만료로 처리
    setTimeout(() => {
      if (!settled) {
        settleToError("인증 링크가 만료되었거나 유효하지 않습니다.<br/>비밀번호 재설정을 다시 요청해주세요.");
      }
    }, 5000);
  }

  async function submitNewPassword(){
    clearFormError();

    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const submitBtn = document.getElementById('submitBtn');

    if (!pw1 || !pw2) {
      showFormError('비밀번호를 모두 입력해주세요.');
      return;
    }
    if (pw1.length < 6) {
      showFormError('비밀번호는 최소 6자 이상이어야 합니다.');
      return;
    }
    if (pw1 !== pw2) {
      showFormError('비밀번호가 일치하지 않습니다.');
      return;
    }
    if (!sb || !recoveryReady) {
      showFormError('인증 세션이 만료되었습니다. 링크를 다시 요청해주세요.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '변경 중...';

    try {
      const { error } = await sb.auth.updateUser({ password: pw1 });
      if (error) throw error;

      // 재설정 완료 후에는 임시 세션을 종료해 보안을 유지합니다.
      await sb.auth.signOut();
      showState(stateSuccess);
    } catch (err) {
      console.error('비밀번호 변경 실패:', err);
      showFormError('비밀번호 변경에 실패했습니다. 잠시 후 다시 시도해주세요.');
      submitBtn.disabled = false;
      submitBtn.textContent = '비밀번호 변경';
    }
  }
</script>
</body>
</html>
